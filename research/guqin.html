<style>
/* ═══════════════════════════════════════════════════════════════════════
   视觉换成《琴境 · UI界面设计》那一套：深色木纹琴面、珍珠徽点、金铜印章、
   碧色高亮。只换皮相——元素、层级、文案、按键、音色、判定一律照旧。
   （他们那份设计里弦是「一弦最细、七弦最粗」，与实琴相反，
     这一条不跟——弦的粗细是琴的事实，不是视觉偏好。）
   ═══════════════════════════════════════════════════════════════════════ */
:root{
  --ink:#eee9df; --muted:#aaa49b;
  --bg:#111214; --panel:#1b1c1e; --panel2:#292a2c;
  --line:rgba(255,255,255,.1); --line2:rgba(255,255,255,.18);
  --gold:#c9a66b; --gold2:#e5c48e; --jade:#54b59f; --green:#65d69e; --red:#b75b51;
  --t1:#f0e9df; --t2:#aaa59d; --t3:#85817b;
  --font:"Songti SC","Noto Serif SC","Source Han Serif SC",STSong,serif;
  --fontD:"Songti SC","Noto Serif SC",serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
.sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:"PingFang SC","Hiragino Sans GB",var(--font);
  -webkit-font-smoothing:antialiased;overscroll-behavior:none;user-select:none;
  -webkit-user-select:none;-webkit-touch-callout:none}
#app{height:100%;display:flex;flex-direction:column;position:relative;overflow:hidden;
  background:
    radial-gradient(ellipse at 50% 22%, rgba(117,84,57,.2), transparent 52%),
    linear-gradient(180deg,#202124 0,#121315 68%,#0d0e0f 100%)}
#app::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.1;z-index:0;
  background-image:repeating-linear-gradient(90deg,transparent 0 3px,rgba(255,255,255,.03) 4px)}
#systemNotice{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));z-index:90;
  width:min(560px,calc(100% - 24px));padding:13px 42px 13px 16px;transform:translate(-50%,18px);
  border:1px solid #a57b4e;border-radius:9px;color:#f0dfbf;background:rgba(39,29,22,.96);
  box-shadow:0 12px 32px rgba(0,0,0,.5);font-size:15px;line-height:1.5;opacity:0;pointer-events:none;
  transition:opacity .18s,transform .18s}
#systemNotice.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#systemNotice button{position:absolute;right:7px;top:7px;padding:5px 8px;border:0;background:transparent;
  border-radius:0;color:#d9c39e;font-size:18px;box-shadow:none}

/* ── 顶栏 ── */
#top{flex:0 0 auto;min-height:58px;display:flex;align-items:center;gap:14px;
  padding:0 clamp(12px,2.4vw,34px);position:relative;z-index:10;
  background:linear-gradient(#303235,#202124);border-bottom:1px solid #08090a;
  box-shadow:inset 0 1px rgba(255,255,255,.08),0 4px 18px rgba(0,0,0,.42)}
#gameBack{flex:0 0 auto;min-width:56px;height:38px;padding:0 8px;border:0;color:#bdb8b0;
  background:transparent;font:500 14px/1 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;
  cursor:pointer;white-space:nowrap}
#gameBack::first-letter{font-size:24px}
#brand{display:flex;align-items:center;gap:8px;font-family:var(--fontD);text-decoration:none;
  font-size:17px;letter-spacing:.14em;line-height:1.2;color:var(--t1)}
#brand::before{content:"琴";flex:0 0 auto;width:32px;height:32px;display:grid;place-items:center;
  border:1px solid #8f7250;border-radius:7px;color:var(--gold2);
  background:linear-gradient(145deg,#5b2c27,#321c1b);letter-spacing:0;
  box-shadow:inset 0 0 0 3px rgba(0,0,0,.22),0 1px rgba(255,255,255,.08);
  font:600 18px/1 var(--fontD)}
#brand small{display:block;font-size:9px;letter-spacing:.14em;color:var(--muted);
  margin-top:4px;font-family:var(--font)}
#judgeFlash{min-width:132px;font-size:15px;letter-spacing:.08em;opacity:0;transition:opacity .16s;
  color:var(--t1)}
#judgeFlash.on{opacity:1}
#judgeFlash small{font-size:11px;letter-spacing:0;color:var(--t3);margin-left:5px}
.hud{display:flex;gap:clamp(14px,2.4vw,30px);align-items:center;margin-left:auto}
.stat{text-align:right;display:grid;gap:2px}
.stat b{display:block;font-size:20px;font-weight:500;font-variant-numeric:tabular-nums;
  font-family:var(--mono);color:#f4efe7}
.stat i{font-style:normal;font-size:clamp(10px,1.15vw,12px);letter-spacing:.06em;color:#8c8984}
.stat i.boost{color:var(--gold2);text-shadow:0 0 10px rgba(229,196,142,.35)}
.stat.orb{width:47px;height:47px;display:grid;place-content:center;text-align:center;gap:0;
  border:1px solid #806b4a;border-radius:50%;color:#e8d4ad;
  background:radial-gradient(circle,#45413a,#232426 68%);box-shadow:inset 0 0 8px #090a0b}
.stat.orb b{font-size:15px;color:#e8d4ad}
.stat.orb i{font-size:10px;color:#8e8980}

/* ── 场地：一张木面卡片 ── */
#stage{flex:1 1 auto;position:relative;min-height:0;z-index:1;
  margin:14px clamp(10px,2.2vw,26px) 6px;padding:10px;
  border:1px solid #343538;border-radius:12px;
  background:linear-gradient(145deg,#252628,#17181a);
  box-shadow:inset 0 1px rgba(255,255,255,.06),0 16px 40px rgba(0,0,0,.35)}
#cv{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  border:2px solid #100c0b;border-radius:46px 12px 16px 38px;
  box-shadow:inset 0 5px 9px rgba(255,255,255,.035),
             inset 0 -18px 28px rgba(0,0,0,.55),0 7px 14px rgba(0,0,0,.45)}

/* ── 浮在琴面右下角的两个小键（原来那排底栏全撤了：选好难度直接开始） ── */
#ctl{position:absolute;right:22px;bottom:20px;display:flex;gap:8px;z-index:12}
#ctl button{padding:7px 14px;font-size:12px;letter-spacing:.16em;
  background:rgba(22,23,25,.82);border-color:#4a4c50;backdrop-filter:blur(8px)}
#ctl button:disabled{opacity:.45}
button{font-family:var(--font);font-size:13px;letter-spacing:.1em;color:#c8c3ba;
  background:#25262a;border:1px solid #45474b;border-radius:6px;
  padding:9px 18px;cursor:pointer;transition:.14s;
  box-shadow:inset 0 1px rgba(255,255,255,.06),0 2px 6px rgba(0,0,0,.3)}
button:hover{filter:brightness(1.15);border-color:#6b6d72;color:#efe9df}
button:disabled{color:#5d5b58;border-color:#303134;background:#1c1d1f;
  box-shadow:none;cursor:default;filter:none}
button.primary{border:1px solid #a07d52;color:#f5eee3;
  background:linear-gradient(#705238,#503824);
  box-shadow:inset 0 1px rgba(255,255,255,.12),0 4px 10px rgba(0,0,0,.35)}
button.primary:hover{filter:brightness(1.12);transform:translateY(-1px)}
button.primary:active{transform:translateY(1px)}
button.primary:disabled{background:#2a2520;border-color:#463b30;color:#6b6560;transform:none}

/* ── 自由试音：右上角按音／泛音切换 ── */
#toneSw{position:absolute;top:22px;right:26px;display:none;z-index:12;
  border:1px solid #45474b;border-radius:7px;overflow:hidden;
  background:rgba(20,21,23,.86);backdrop-filter:blur(8px);
  box-shadow:0 6px 18px rgba(0,0,0,.45)}
#toneSw.on{display:flex}
#freeReadout{min-width:210px;padding:8px 14px;display:flex;align-items:center;
  justify-content:flex-start;text-align:left;color:#d4c6a7;font-size:12.5px;letter-spacing:.12em;
  white-space:nowrap;border-right:1px solid #35373b}
#freeReadout:empty{display:none}
/* 简谱数字、八度点与泛音圈必须是三个独立层。
   不能再用 Unicode 组合点：不同中文字体会把组合点挂到数字右侧。 */
.free-jianpu{position:relative;display:inline-block;min-width:1em;margin-left:.08em;
  color:inherit;font-family:Arial,sans-serif;font-size:1.18em;line-height:.78;
  text-align:center;letter-spacing:0;vertical-align:middle}
.free-jianpu-digit{display:block;margin:0;padding:0;line-height:.78}
.free-jianpu-acc{position:absolute;top:-.08em;left:-.58em;font-size:.62em;line-height:1}
.free-jianpu-dots{position:absolute;left:50%;display:flex;flex-direction:column;
  align-items:center;gap:.10em;transform:translateX(-50%)}
.free-jianpu-dots i{width:.17em;height:.17em;display:block;border-radius:50%;background:currentColor}
.free-jianpu-above{bottom:calc(100% + .10em)}
.free-jianpu-below{top:calc(100% + .10em)}
.free-jianpu-circle{position:absolute;left:50%;bottom:calc(100% + .16em);width:.34em;height:.34em;
  border:.085em solid currentColor;border-radius:50%;transform:translateX(-50%)}
.free-jianpu.has-up-1 .free-jianpu-circle{bottom:calc(100% + .47em)}
.free-jianpu.has-up-2 .free-jianpu-circle{bottom:calc(100% + .70em)}
button.sw{border:0;border-radius:0;padding:8px 15px;font-size:12.5px;letter-spacing:.18em;
  color:#8b877f;background:transparent;box-shadow:none}
button.sw+button.sw{border-left:1px solid #35373b}
button.sw:hover{background:#2a2c30;color:#d8d2c7;filter:none}
button.sw.on{background:linear-gradient(#705238,#503824);color:#f5eee3}
button.sw.on:hover{background:linear-gradient(#7a5a3d,#5a4029);color:#f5eee3}
#bJianpuMap.on{background:linear-gradient(#7a5a3d,#5a4029);color:#f5eee3}
.tone-mode-group{display:flex;border:1px solid #45474b;border-radius:8px;overflow:hidden;background:rgba(20,21,23,.88)}
#bJianpuMap{border:1px solid #57534c;border-radius:8px;background:rgba(20,21,23,.88)}

/* 首页内嵌琴面：只保留可演奏琴和琴面开关，不重复整套游戏顶栏与退出键。 */
html.embed-home,html.embed-home body{background:transparent}
html.embed-home #app{background:transparent}
html.embed-home #app::before,html.embed-home #top,html.embed-home #ctl,
html.embed-home #menu,html.embed-home #systemNotice{display:none!important}
html.embed-home #stage{margin:0;padding:58px 1.4% 54px;border:0;border-radius:0;background:transparent;box-shadow:none}
html.embed-home #cv{border:0;border-radius:0;clip-path:none;box-shadow:none;background:transparent}
html.embed-home #toneSw{top:8px;left:1.4%;right:1.4%;max-width:none;border:0;background:transparent;box-shadow:none;overflow:visible;justify-content:space-between}
html.embed-home #freeReadout{position:absolute;left:0;bottom:-46px;z-index:20;min-width:0;max-width:70%;
  padding:8px 12px;border:1px solid rgba(201,166,107,.35);border-radius:6px;background:rgba(20,21,23,.86)}
html.embed-home button.sw{padding:8px clamp(8px,1.4vw,15px);font-size:clamp(10px,1.2vw,12.5px);white-space:nowrap}
@media(max-width:520px){html.embed-home #stage{padding-top:52px;padding-bottom:47px}html.embed-home #toneSw{left:2%;right:2%;top:6px}html.embed-home button.sw{padding-inline:8px;letter-spacing:.06em}html.embed-home #freeReadout{bottom:-40px;max-width:100%;font-size:11px}}
@media(max-height:450px) and (orientation:landscape){html.embed-home #stage{padding-top:46px;padding-bottom:8px}html.embed-home #toneSw{top:3px}html.embed-home #freeReadout{bottom:-34px;padding:5px 8px}}

.game-nav-actions{display:flex;align-items:center;gap:clamp(14px,2.2vw,28px)}
.game-nav-actions button,.game-nav-actions a{position:relative;min-width:42px;height:38px;display:grid;place-items:center;padding:0;border:0;border-radius:0;color:#aaa69f;background:transparent;text-decoration:none;font-size:14px}
.game-nav-actions a.is-current{color:#f3d69e;font-weight:650}
.game-nav-actions a.is-current::after{content:"";position:absolute;left:0;right:0;bottom:1px;height:2px;border-radius:2px;background:#c99f61}
.game-nav-actions .game-help{border-radius:50%;min-width:38px;width:38px;padding:0;font:600 18px/1 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
.modal-x{position:absolute;right:12px;top:12px;z-index:3;width:32px;height:32px;padding:0;border:0;border-radius:0;box-shadow:none;font:300 22px/1 -apple-system,BlinkMacSystemFont,sans-serif;background:transparent}
#menuBox,#cardWrap,.game-help-card{position:relative}
#cardWrap{width:min(640px,100%)}
#card{width:100%}
#gameHelp{position:fixed;inset:0;z-index:100;display:none;place-items:center;padding:22px;background:rgba(4,5,6,.78);backdrop-filter:blur(12px)}
#gameHelp.on{display:grid}
.game-help-card{width:min(520px,100%);padding:32px;border:1px solid #57524b;border-radius:16px;background:#1b1c1e;box-shadow:0 24px 70px rgba(0,0,0,.65)}
.game-help-card h2{margin:0 0 18px;font:500 24px/1.3 var(--fontD);color:#f0e9df}
.game-help-card ol{margin:0;padding-left:1.4em;color:#cbc4b9;line-height:1.9;font-size:15px}

/* ── 主界面 ── */
#menu{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
  z-index:30;padding:24px;background:rgba(4,5,6,.75);backdrop-filter:blur(12px)}
#menu.on{display:flex}
#menuBox{width:min(500px,100%);padding:34px 40px 30px;text-align:center;
  border:1px solid #57524b;border-radius:12px;
  background:linear-gradient(145deg,#2a2b2d,#17181a);
  box-shadow:inset 0 1px rgba(255,255,255,.08),0 24px 70px rgba(0,0,0,.65)}
#menuBox::before{content:"琴";display:grid;place-items:center;width:66px;height:66px;
  margin:0 auto 16px;border:1px solid #8c6f4d;border-radius:9px;color:#ebcb98;
  background:linear-gradient(145deg,#542b27,#281919);
  box-shadow:inset 0 0 0 4px rgba(0,0,0,.22);font:500 30px/1 var(--fontD)}
#menuBox h1{font-family:var(--fontD);font-size:34px;letter-spacing:.3em;margin:0 0 8px;
  text-indent:.3em;color:#f0e9df;font-weight:500}
#menuBox .menu-subtitle{margin:0 0 16px;color:#a99e90;font-size:11px;letter-spacing:.18em}
#menuBox .sub{font-size:10px;letter-spacing:.17em;color:#aaa096;margin:0 0 26px}
button.mi{display:block;width:100%;text-align:left;padding:13px 18px;margin-bottom:10px;
  border:1px solid #403c35;border-radius:8px;background:#121315;letter-spacing:.06em;
  box-shadow:none}
button.mi b{display:block;font-family:var(--fontD);font-size:17px;font-weight:500;
  letter-spacing:.16em;margin-bottom:3px;color:#efe7da}
button.mi i{font-style:normal;font-size:10px;letter-spacing:.1em;color:#8b877f}
button.mi:hover{border-color:#8c6f4d;background:#191a1d;filter:none;transform:translateY(-1px)}
button.mi:hover b{color:var(--gold2)}

/* ── 主界面上那张能拨响的小琴（照琴境的做法：开局先摸一下弦） ── */
#mqin{display:block;width:100%;height:118px;margin:2px 0 22px;cursor:crosshair;
  touch-action:none}

/* ── 难度：主界面上的三档 ── */
#diffRow,#songRow{display:flex;gap:0;margin:0 0 8px;border:1px solid #403c35;border-radius:8px;
  overflow:hidden;background:#121315}
#songRow{margin-bottom:16px}
#songRow button.df{font-family:var(--fontD);font-size:15px;letter-spacing:.14em}
button.df{flex:1;border:0;border-radius:0;padding:9px 0;font-size:13px;letter-spacing:.2em;
  color:#8b877f;background:transparent;box-shadow:none}
button.df+button.df{border-left:1px solid #2b2c2f}
button.df:hover{background:#1c1d20;color:#d8d2c7;filter:none;transform:none}
button.df.on{background:linear-gradient(#705238,#503824);color:#f5eee3}
button.df.on:hover{background:linear-gradient(#7a5a3d,#5a4029);color:#f5eee3}
#diffNote{margin:0 0 18px;min-height:10px}
#pickDiff{display:none}
#menu.pick2 #pickSong{display:none}
#menu.pick2 #pickDiff{display:block}
.step{margin:0 0 7px;font-size:10px;letter-spacing:.3em;color:#8d867b}
#chosen{margin:0 0 16px;font-family:var(--fontD);font-size:22px;letter-spacing:.18em;
  color:var(--gold2)}
.mrow{display:flex;gap:9px;justify-content:center}

/* ── 结算：按类别的小结（逐音明细表已撤） ── */
#byKind{margin:6px 0 2px;padding:11px 14px;text-align:center;font-size:12px;line-height:1.9;
  color:#cfc6b8;border:1px solid #3b3c3f;border-radius:8px;background:#1a1b1d;
  letter-spacing:.04em}

/* ── 统一结算：星级是唯一评价，不展示分数与百分比 ── */
.result-stars{display:flex;justify-content:center;gap:10px;margin:28px 0 9px;font-size:clamp(34px,7vw,50px);line-height:1}
.result-stars .is-earned{color:#e6c781;text-shadow:0 0 18px rgba(230,199,129,.28);animation:resultStarPop .42s cubic-bezier(.2,1.6,.4,1) both}
.result-stars .is-hollow{color:#4d473e}
.result-star-caption{margin:0;text-align:center;color:#a79f93;font-size:13px;letter-spacing:.1em}
.result-praise{max-width:34em;margin:22px auto 0;text-align:center;color:#eee4d4;font-size:16px;line-height:1.85}
.result-actions button{min-width:116px}
@keyframes resultStarPop{from{opacity:0;transform:scale(.35) rotate(-18deg)}to{opacity:1;transform:none}}
#praise{margin:14px 0 2px;padding:13px 16px;text-align:center;font-size:13px;line-height:1.9;
  color:#e3d9c7;border:1px solid #4d4740;border-radius:8px;
  background:linear-gradient(145deg,rgba(201,166,107,.10),rgba(201,166,107,.03))}

/* ── 结算弹窗 ── */
#veil{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
  z-index:20;padding:22px;overflow:auto;background:rgba(4,5,6,.75);backdrop-filter:blur(12px)}
#veil.on{display:flex}
#card{width:min(640px,100%);padding:30px 34px 26px;
  border:1px solid #57524b;border-radius:12px;
  background:linear-gradient(145deg,#2a2b2d,#17181a);
  box-shadow:inset 0 1px rgba(255,255,255,.08),0 24px 70px rgba(0,0,0,.65)}
#card h2{margin:0;font-size:10px;letter-spacing:.32em;color:#aaa096;font-weight:400;
  text-align:center}
.mx{display:grid;grid-template-columns:repeat(auto-fit,minmax(72px,1fr));gap:5px;margin-bottom:20px}
.mx div{text-align:center;padding:9px 2px;border:1px solid #393a3c;border-radius:5px;
  background:#1a1b1d}
.mx b{display:block;font-family:var(--mono);font-size:17px;font-weight:500;color:#d7d0c5;
  font-variant-numeric:tabular-nums}
.mx i{display:block;font-style:normal;font-size:8px;letter-spacing:.08em;color:#817d76;
  margin-top:3px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{font-weight:400;font-size:9px;letter-spacing:.14em;color:#817d76;text-align:left;

/* ── 左上返回 ← 与右上退出 × ──────────────────────────────────────────
   这两个键的位置和尺寸从此只写在变量里，顶部控制区（#toneSw）的左右让位
   由同一组变量算出来（--qin-nav-left / --qin-nav-right）。
   v1.87 之前是两处各写死一个数字：返回键 left:28px + 宽 42px 占到 70px，
   而控制区从 left:40px 开始——「录制你的专属琴音」正好被箭头压住。
   现在只要改一处，让位自动跟着变，不会再错开。 */
:root{
  --qin-nav-inset:28px;   /* 返回／退出键距屏幕边的距离 */
  --qin-nav-size:42px;    /* 键的边长 */
  --qin-nav-gap:14px;     /* 键与控制区之间至少留的空隙 */
  --qin-nav-left:calc(var(--qin-nav-inset) + var(--qin-nav-size) + var(--qin-nav-gap));
  --qin-nav-right:calc(var(--qin-nav-inset) + var(--qin-nav-size) + var(--qin-nav-gap));
}
#qinBack,#qinExit{position:fixed;top:24px;z-index:120;
  width:var(--qin-nav-size);height:var(--qin-nav-size);padding:0;border:0;
  border-radius:0;color:#5a554c;background:transparent;box-shadow:none;
  font:300 29px/1 Georgia,serif;letter-spacing:0}
#qinBack{left:var(--qin-nav-inset)}
#qinExit{right:var(--qin-nav-inset)}
#qinBack .qin-back-glyph{position:relative;display:block;width:17px;height:14px;margin:auto}
#qinBack .qin-back-glyph::before{content:"";position:absolute;left:1px;top:6px;width:15px;
  border-top:1.35px solid currentColor}
#qinBack .qin-back-glyph::after{content:"";position:absolute;left:1.5px;top:3px;width:7px;height:7px;
  border-left:1.35px solid currentColor;border-bottom:1.35px solid currentColor;transform:rotate(45deg)}
#qinBack:hover,#qinExit:hover{color:#2c2a26;background:transparent;filter:none;transform:none}
#qinBack:focus-visible,#qinExit:focus-visible{outline:1px solid #5e4c3d;outline-offset:3px}
#recordCtl{display:flex;align-items:stretch}
#recordButton{display:flex;align-items:center;gap:7px;min-width:0;white-space:nowrap}
#recordButton:hover{color:#2c2a26;background:#fffaf0;filter:none;transform:none}
#recordButton .record-dot{width:9px;height:9px;flex:0 0 auto;border-radius:50%;background:#9a3d34;box-shadow:0 0 0 1px rgba(154,61,52,.15)}
#recordButton time{display:none;min-width:34px;font-variant-numeric:tabular-nums;letter-spacing:0}
#recordButton.is-recording{color:#fff;border-color:#9a3d34;background:#9a3d34;box-shadow:0 8px 25px rgba(118,38,31,.26)}
#recordButton.is-recording .record-dot{background:#fff;animation:recordPulse 1.15s ease-out infinite}
#recordButton.is-recording time{display:inline}
#recordButton:disabled{opacity:.72;cursor:wait}
.tone-left-actions{display:flex;border:1px solid #45474b;border-radius:8px;overflow:hidden;background:rgba(20,21,23,.88)}
#worldMapButton{display:flex;align-items:center;gap:7px;white-space:nowrap;border-left:1px solid #35373b}
.tone-mode-group #bJianpuMap{border:0;border-radius:0;background:transparent}
.map-globe{position:relative;width:15px;height:15px;flex:0 0 auto;border:1px solid currentColor;border-radius:50%;opacity:.88}
.map-globe::before{content:"";position:absolute;left:3px;right:3px;top:-1px;bottom:-1px;border-left:1px solid currentColor;border-right:1px solid currentColor;border-radius:50%}
.map-globe::after{content:"";position:absolute;left:1px;right:1px;top:6px;border-top:1px solid currentColor}
#recordToast{position:fixed;left:50%;bottom:66px;z-index:250;max-width:min(420px,calc(100vw - 32px));padding:9px 14px;border:1px solid rgba(94,76,61,.18);border-radius:10px;color:#4f473f;background:rgba(250,247,239,.96);box-shadow:0 9px 30px rgba(44,42,38,.15);font:12px/1.45 system-ui,-apple-system,sans-serif;opacity:0;pointer-events:none;transform:translate(-50%,8px);transition:.2s}
#recordToast.on{opacity:1;transform:translate(-50%,0)}
html.world-replay .tone-left-actions,html.world-replay #bPressed,html.world-replay #bHarm,html.world-replay #qinLang,html.world-replay #recordToast,html.world-replay #qinBack,html.world-replay #qinExit,html.world-replay #guqinRelease{display:none!important}

  document.querySelector('meta[name="twitter:description"]').content = metaText.short;
  document.querySelectorAll('[data-qin-zh]').forEach(function(el){
    el.innerHTML = english ? el.dataset.qinEn : el.dataset.qinZh;
  });
  const exit = document.getElementById('qinExit');
  const back = document.getElementById('qinBack');
  const goBack = function(){ location.href = '../'; };
  back.setAttribute('aria-label', english ? 'Back to home' : '返回首页');
  back.onclick = goBack;
  exit.setAttribute('aria-label', english ? 'Exit Virtual Guqin' : '退出虚拟古琴');
  exit.onclick = goBack;
  document.addEventListener('keydown', function(event){ if (event.key === 'Escape') exit.click(); });
  document.getElementById('a11yTarget').textContent = english ? 'Ready' : '等待开始';
  document.querySelector('#systemNotice button').setAttribute('aria-label', english ? 'Close notice' : '关闭提示');
  const mapButton = document.getElementById('worldMapButton');
  mapButton.setAttribute('aria-label', english ? 'Open the World Guqin Map' : '打开世界古琴地图');
  mapButton.onclick = function(){ location.href = '../world-map.html?lang=' + (english ? 'en' : 'zh'); };
  const qinLang = document.getElementById('qinLang');
  qinLang.textContent = english ? '中文' : 'EN';
  qinLang.setAttribute('aria-label', english ? 'Switch to Chinese' : '切换到英文');
  qinLang.onclick = function(){ const params=new URLSearchParams(location.search);params.set('entry','free');params.set('lang',english?'zh':'en');location.search=params.toString(); };
  document.getElementById('cv').setAttribute('aria-label', english
    ? 'Playable guqin. Touch the seven strings at hui positions to play harmonics.'
    : '可演奏古琴。轻触七弦与徽位交点演奏泛音。');
  setSound('harmonic');
  setFreeMapButton();
})();
</script>
