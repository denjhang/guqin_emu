<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>减字谱引擎 H5 · 古琴</title>
<style>
  :root { --ink:#2b0000; --bg:#f7f3e8; --paper:#fffdf6; --accent:#8b2f2f; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:"Microsoft YaHei",system-ui,sans-serif; background:var(--bg); color:var(--ink); }
  header { background:var(--paper); border-bottom:2px solid #e4d9c3; padding:10px 16px; display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  header h1 { font-size:18px; margin:0; color:var(--accent); }
  .tab { border:1px solid #d8c9a8; background:transparent; padding:6px 14px; border-radius:16px; cursor:pointer; font-size:14px; }
  .tab.active { background:var(--accent); color:#fff; border-color:var(--accent); }
  .page { display:none; padding:16px; max-width:1100px; margin:0 auto; }
  .page.show { display:block; }
  /* 库 */
  #scoreList { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:8px; }
  .score-item { background:var(--paper); border:1px solid #e0d5bb; border-radius:8px; padding:10px; text-align:left; cursor:pointer; display:flex; flex-direction:column; gap:4px; }
  .score-item:hover { border-color:var(--accent); }
  .s-title { font-weight:bold; font-size:15px; }
  .s-meta { font-size:12px; color:#8a7d63; }
  .toolbar { display:flex; gap:8px; align-items:center; margin:10px 0; flex-wrap:wrap; }
  .toolbar input[type=text], .toolbar input[type=number] { padding:6px 10px; border:1px solid #d8c9a8; border-radius:6px; }
  .toolbar select { padding:6px; border:1px solid #d8c9a8; border-radius:6px; }
  .btn { background:var(--accent); color:#fff; border:none; border-radius:6px; padding:7px 16px; cursor:pointer; font-size:14px; }
  .btn.ghost { background:transparent; color:var(--accent); border:1px solid var(--accent); }
  /* 谱面 */
  .score-line { display:flex; flex-wrap:wrap; gap:6px; align-items:center; background:var(--paper); border:1px solid #e8dfc8; border-radius:8px; padding:8px; margin-bottom:6px; }
  .jz-token { border:none; background:transparent; padding:2px; cursor:pointer; border-radius:6px; line-height:0; }
  .jz-token:hover { background:#f3e9d2; }
  .jz-token.flash { animation:fl .35s; }
  .jz-token.playing { background:#f8d9d9; box-shadow:0 0 0 2px var(--accent); }
  /* 顶部滚动谱条 + 琴面（复刻 APK 演奏页布局） */
  #stripWrap { overflow-x:auto; background:var(--paper); border:1px solid #e0d5bb; border-radius:10px; padding:10px 6px; scrollbar-width:thin; }
  #strip { display:flex; gap:8px; align-items:center; width:max-content; padding:0 40vw; }
  #strip .jz-token.playing { background:#f8d9d9; box-shadow:0 0 0 3px var(--accent); border-radius:8px; }
  #strip .jz-token.done { opacity:.35; }
  #strip .sep { width:2px; height:48px; background:#e4d9c3; margin:0 6px; flex:none; }
  #qinCanvas { width:100%; height:260px; display:block; margin-top:10px; border-radius:10px; }
  #explainBox { background:#fdf6e3; border-left:4px solid var(--accent); padding:8px 12px; margin:8px 0; font-size:14px; color:#5a4a2f; border-radius:0 6px 6px 0; }
  /* 琴谱大厅 */
  #hallGrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; }
  .hall-card { background:var(--paper); border:1px solid #e0d5bb; border-radius:10px; padding:8px; text-align:left; cursor:pointer; display:flex; flex-direction:column; gap:6px; }
  .hall-card:hover { border-color:var(--accent); transform:translateY(-1px); }
  .hall-card .cover { position:relative; border-radius:6px; overflow:hidden; line-height:0; }
  .hall-card .cover svg { width:100%; height:auto; }
  .hc-faved { position:absolute; top:6px; right:6px; background:var(--accent); color:#fff; font-size:11px; padding:2px 6px; border-radius:8px; line-height:normal; }
  .hc-title { font-weight:bold; font-size:14px; }
  .hc-meta { display:flex; justify-content:space-between; font-size:12px; color:#8a7d63; }
  .hall-head { display:flex; gap:14px; background:var(--paper); border:1px solid #e0d5bb; border-radius:10px; padding:12px; margin-bottom:10px; align-items:center; }
  .hall-cover { width:96px; border-radius:8px; overflow:hidden; flex:none; line-height:0; border:1px solid #e8dcc0; }
  .hall-cover svg { width:100%; height:auto; }
  .hall-info h2 { margin:0 0 4px; color:var(--accent); }
  .hall-author { font-size:13px; color:#8a7d63; }
  .hall-author::before { content:"👤 "; opacity:.6; }
  #hallStripWrap { overflow-x:auto; background:var(--paper); border:1px solid #e0d5bb; border-radius:10px; padding:10px 6px; }
  #hallStrip { display:flex; gap:4px; align-items:flex-end; width:max-content; padding:0 40vw; }
  .hall-cell { border:none; background:transparent; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:2px; padding:4px 3px; border-radius:8px; line-height:1; }
  .hall-cell:hover { background:#f3e9d2; }
  .hall-cell .rhythm { font-size:15px; color:#6b5a3a; min-height:20px; }
  .hall-cell.flash { background:#f3e0d2; }
  .hall-cell.playing { background:#f8d9d9; box-shadow:0 0 0 3px var(--accent); }
  .hall-cell.done { opacity:.35; }
  #hallFavBtn.liked { background:#c0392b; border-color:#c0392b; color:#fff; }
  #fullScoreBox { margin-top:10px; }
  #fullScoreBox summary { cursor:pointer; color:#8a7d63; font-size:13px; }
  @keyframes fl { 0%{background:var(--accent)} 100%{background:transparent} }
  .line-btn { border:none; background:#eee6d0; border-radius:4px; cursor:pointer; padding:4px 8px; margin-left:4px; }
  .blank { width:14px; }
  /* 输入区 */
  #inputPanel { background:var(--paper); border:1px solid #e0d5bb; border-radius:10px; padding:14px; margin-bottom:12px; }
  #inputBox { width:100%; font-size:18px; padding:10px; border:1px solid #d8c9a8; border-radius:6px; margin:6px 0; }
  #inputEcho { font-size:13px; color:#8a7d63; min-height:18px; }
  .hint { font-size:12px; color:#a09478; margin-top:6px; }
  #micBtn.rec { background:#c0392b; animation:pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity:.6; } }
  h2 { font-size:16px; color:var(--accent); margin:8px 0; }
</style>
</head>
<body>
<header>
  <h1>减字谱引擎 H5</h1>
  <button class="tab active" data-tab="library">乐谱库</button>
  <button class="tab" data-tab="hall">琴谱大厅</button>
  <button class="tab" data-tab="score">谱面</button>
  <button class="tab" data-tab="editor">作曲 · 输入</button>
</header>

<div class="page" id="page-hall">
  <div class="toolbar">
    <span style="font-size:13px;color:#8a7d63">灵感值得被听见。收藏喜欢的琴友分享，稍后再看。</span>
    <span id="hallCount" style="font-size:13px;color:#8a7d63;margin-left:auto"></span>
  </div>
  <div id="hallGrid"></div>
</div>

<div class="page" id="page-hallview">
  <div class="hall-head">
    <span id="hallCover" class="hall-cover"></span>
    <div class="hall-info">
      <h2 id="hallTitle">—</h2>
      <div id="hallAuthor" class="hall-author"></div>
      <div class="toolbar" style="margin:8px 0 0">
        <button class="btn" id="hallPlayBtn">▶ 播放模式</button>
        <button class="btn ghost" id="hallStopBtn">■ 停止</button>
        <button class="btn ghost" id="hallEditBtn">✎ 编辑模式</button>
        <button class="btn ghost" id="hallFavBtn">♡ 收藏</button>
        <label style="font-size:13px">速度 <input type="number" id="hallTempo" value="60" min="20" max="200" style="width:60px"></label>
      </div>
    </div>
  </div>
  <div id="hallStripWrap"><div id="hallStrip"></div></div>
  <p class="hint">播放模式下谱条自动跟随；上行为节奏音符，下行为减字。点任意减字可点读。此视图无琴面模拟器。</p>
</div>

<div class="page show" id="page-library">
  <div class="toolbar">
    <input type="text" id="searchBox" placeholder="搜索曲目…" style="width:220px">
    <span id="libCount" style="font-size:13px;color:#8a7d63"></span>
    <button class="btn ghost" id="newScoreBtn">＋ 新谱</button>
  </div>
  <div id="scoreList"></div>
</div>

<div class="page" id="page-score">
  <div class="toolbar">
    <h2 id="scoreTitle" style="flex:1">未选择曲目</h2>
    <label>速度 <input type="number" id="tempoInput" value="60" min="20" max="200" style="width:70px"></label>
    <button class="btn" id="playBtn">▶ 播放</button>
    <button class="btn ghost" id="stopBtn">■ 停止</button>
  </div>
  <div id="stripWrap">
    <div id="strip"></div>
  </div>
  <p class="hint">上方谱条自动跟随播放滚动，点任意减字可点读并显示技法解说；下方琴面实时演示按弦与拨弦位置。</p>
  <div id="explainBox" style="display:none"></div>
  <canvas id="qinCanvas"></canvas>
  <details id="fullScoreBox">
    <summary>整谱网格视图</summary>
    <div id="scoreView"></div>
  </details>
</div>

<div class="page" id="page-editor">
  <div id="inputPanel">
    <b>文字 / 语音 → 减字</b>
    <input type="text" id="inputBox" placeholder='输入如：大七挑四 散勾三 泛起 名九勾二 撮大九四散七 上七六（空格分隔，回车录入）'>
    <div class="toolbar" style="margin:6px 0">
      <button class="btn" id="inputBtn">录入 →</button>
      <button class="btn ghost" id="micBtn">🎤 语音</button>
      <label>节奏
        <select id="rhythmSel">
          <option value="quarter">♪ 四分</option>
          <option value="eighth">♪ 八分</option>
          <option value="half">𝅗𝅥 二分</option>
          <option value="sixteenth">♬ 十六分</option>
          <option value="whole">𝅝 全音</option>
        </select>
      </label>
    </div>
    <div id="inputEcho">语音可说：大七挑四、散勾三、泛起…（说完自动录入）</div>
    <p class="hint">支持：散/泛/按音（指+徽+技法+弦）、绰注吟猱撞、撮、上下滑音、掐起带起、泛起泛止少息曲终、进复退复应合分开。右键删除已录的字。</p>
  </div>
  <div class="toolbar">
    <input type="text" id="editTitle" placeholder="曲名" style="width:160px">
    <button class="btn" id="editPlayBtn">▶ 播放此谱</button>
    <button class="btn ghost" id="saveBtn">⬇ 导出 JSON</button>
    <button class="btn ghost" id="clearBtn">清空</button>
  </div>
  <div id="editorView"></div>
</div>

<script src="js/render.js"></script>
<script src="js/semantics.js"></script>
<script src="js/audio.js"></script>
<script src="js/qin.js"></script>
<script src="js/player.js"></script>
<script src="js/input.js"></script>
<script src="js/speech.js"></script>
<script src="js/hall.js"></script>
<script src="js/app.js"></script>
</body>
</html>
